  - id: depenses-contraintes
    origine: debat
    minutage: "125:37"
    enonce: "Parce qu'on oublie de vous dire, c'est que les dépenses contraintes, elles ont considérablement augmenté depuis les 10 dernières années"
    domaine: null
    valeur_enoncee: "« considérablement », 10 ans"
    verdict_attendu: too_vague
    robustesse: mecanique
    atteignable_aujourdhui: oui
    motif: >
      « Considérablement » n'est pas une valeur, et « dépenses contraintes »
      n'a pas de définition statistique unique. Non testable en l'état.

  # --- engagements : hors de l'échelle de vérité --------------------------

  - id: impots-production-50
    origine: debat
    minutage: "157:02"
    enonce: "Je propose d'abord de supprimer 50 milliards d'impôts de production et de le financer par la suppression de 50 milliards"
    domaine: finances-publiques
    valeur_enoncee: "50 milliards"
    verdict_attendu: out_of_scope
    robustesse: mecanique
    atteignable_aujourdhui: oui
    motif: >
      Promesse. Ni vraie ni fausse : elle sera confrontée au programme publié
      par la voie de la cohérence, jamais par l'échelle de vérité.

  # --- items construits : le piège de définition de la fiche emploi -------
  #
  # Le débat LaREF ne déclenche jamais ce piège. Ces quatre énoncés sont
  # écrits à la main pour le tester, et ne comptent dans aucune mesure de
  # performance réelle.

  - id: c-chomage-bit-73
    origine: construit
    enonce: "Le taux de chômage est à 7,3 % de la population active."
    domaine: emploi
    source_attendue: insee-chomage-bit-t2-2026
    grandeur: "taux de chômage au sens du BIT, % de la population active"
    valeur_enoncee: "7,3 %"
    valeur_source: "7,3 %"
    millesime_source: "T2 2026"
    ecart: "0 point"
    verdict_attendu: exact
    robustesse: mecanique
    atteignable_aujourdhui: oui
    motif: "Témoin positif : la bonne grandeur, la bonne valeur, la bonne source."

  - id: c-confusion-taux-effectif
    origine: construit
    enonce: "Il y a 7,3 % de demandeurs d'emploi en catégorie A."
    domaine: emploi
    source_attendue: francetravail-categorie-a-2026-06
    grandeur: "effectif de catégorie A — mais énoncé comme un taux"
    valeur_enoncee: "7,3 %"
    valeur_source: "2 710 400 personnes"
    millesime_source: "juin 2026"
    ecart: "grandeurs incomparables"
    verdict_attendu: conflicting_sources
    robustesse: mecanique
    atteignable_aujourdhui: oui
    motif: >
      Le piège que la fiche `emploi` signale en tête : un taux BIT et un
      effectif de catégorie A ne se comparent jamais. Le nombre 7,3 est celui
      du taux BIT, appliqué à la mauvaise grandeur. Un système qui rend
      « exact » ici a confondu deux mesures produites par deux organismes.

  - id: c-cat-a-2-7m
    origine: construit
    enonce: "Il y a 2,7 millions de demandeurs d'emploi en catégorie A."
    domaine: emploi
    source_attendue: francetravail-categorie-a-2026-06
    grandeur: "effectif de catégorie A"
    valeur_enoncee: "2,7 millions"
    valeur_source: "2 710 400"
    millesime_source: "juin 2026"
    ecart: "0,4 % en relatif"
    verdict_attendu: exact
    robustesse: mecanique
    atteignable_aujourdhui: oui
    motif: "Arrondi usuel d'un effectif. Écart relatif très inférieur à toute barre."

  - id: c-cat-a-27m
    origine: construit
    enonce: "Il y a 27 millions de demandeurs d'emploi en catégorie A."
    domaine: emploi
    source_attendue: francetravail-categorie-a-2026-06
    grandeur: "effectif de catégorie A"
    valeur_enoncee: "27 millions"
    valeur_source: "2 710 400"
    millesime_source: "juin 2026"
    ecart: "facteur 10"
    verdict_attendu: "false"   # entre guillemets : sans eux, YAML lit un booléen
    robustesse: mecanique
    atteignable_aujourdhui: oui
    motif: >
      Un ordre de grandeur d'écart, source de rang 1 : le rouge est mérité.
      C'est aussi la forme exacte d'une corruption d'ASR — un facteur dix par
      déplacement de virgule — ce qui en fait le témoin du garde-fou : la
      chaîne ne doit publier ce rouge que si une seconde transcription porte
      le même chiffre.
