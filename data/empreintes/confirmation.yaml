# Une minute d'ecoute par voix, et l'attribution devient utilisable.
#
# Pour chaque grappe : ecouter les trois moments indiques dans
# data/audio/laref2026.wav, puis remplir `confirme` avec le nom entendu, ou
# `inconnu` si ce n'est aucun des intervenants, ou `plusieurs` si la
# grappe melange visiblement deux personnes.
#
# `nom_suggere` vient des patronymes prononces juste avant la prise de
# parole. Ils orientent, ils ne prouvent pas -- c'est exactement ce que
# votre oreille tranche.
#
# Puis : scripts/enrol.py ... --confirmer data/empreintes/confirmation.yaml

